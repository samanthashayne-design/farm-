<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p5.js & Assets Demo</title>
    <link rel="stylesheet" href="styles2.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>

    <script src="sketch2.js" defer></script>
  </head>

  <body>
    <h1>my farm</h1>
    <div id="sketch2">
      <button id="playBtn" aria-label="Play">▶</button>
       <button id="prev-scene">🏠</button>
       <button id="plantCropsBtn" class="scene-btn">plant crops</button>
      <button id="tendGardenBtn" class="scene-btn">tend garden</button>
      <button id="shovelBtn" class="tool-btn">dig</button>
      <button id="wateringCanBtn" class="tool-btn">water</button>
      <div class="button-row">
        <button id="rainBtn">🌧️</button>
        <button id="dayNightBtn">☀️</button>
       
      </div>
    </div>
  </body>
</html>
